# Generated by fmverify for CommunityToolkit.HighPerformance.
#
# fmverify does not edit your pipeline (I-NO-TOUCH). To enable this gate, COPY this file to
# .github/workflows/verification.yml. It must live there: GitHub only resolves a local
# workflow under .github/workflows/, so referencing it from where it sits does not work.
#
# Until you copy it, the proof gate does not run in CI.
#
# Do not instead add the verification projects to your own solution. That pulls generated
# model code into your static analysis, your coverage figures and possibly your packaged
# output. The separate solution is deliberate.

name: Verification

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: standard2.0.x
      - name: Prove
        working-directory: verification
        run: bash ./verify.sh
      - name: Upload SARIF
        if: always() && hashFiles('verification/translation/fmverify-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: verification/translation/fmverify-results.sarif
